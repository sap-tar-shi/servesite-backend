name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: servesite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://servesite_app:servesite_app@localhost:5432/servesite
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,.localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 black

      - name: Create non-superuser DB role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "
            CREATE ROLE servesite_app WITH LOGIN PASSWORD 'servesite_app' CREATEDB;
            GRANT ALL PRIVILEGES ON DATABASE servesite TO servesite_app;
          "

      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --exclude=venv,migrations

      - name: Format check (black)
        run: black --check . --exclude venv

      - name: Run migrations
        run: python manage.py migrate

      - name: Run isolation test suite (hard gate — must pass before any other tests run)
        run: python manage.py test core.test_isolation tenants core

      - name: Run full test suite
        run: python manage.py test